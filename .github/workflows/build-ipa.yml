      - name: Check DXMT CopyStructureCount
        run: python3 tests/host/check-dxmt-copy-structure-count.py

      # madeira-bcd (round 620): Frostbite 2's render target views on a buffer: logged, and env.MADEIRA_BUFFER_RTV_EMPTY = 1
      # answers them with no view (Need for Speed: The Run; the DXMT patch, d3d11-src.dll for 64-bit games).
      - name: Check DXMT render target views on a buffer
        run: python3 tests/host/check-dxmt-buffer-rtv.py

      # madeira-bcd (round 624): Dark Souls III's SRV mip count from GetDesc (the DXMT patch, opt-in; d3d11-src.dll for the 64-bit game).
      - name: Check DXMT SRV GetDesc mip count
        run: python3 tests/host/check-dxmt-srv-getdesc.py

      # madeira-bcd (round 620, thebcd69/bcd-games#17): Add a game names why a file is not a Windows program (words only).
      - name: Check the not-a-Windows-program words
        run: python3 tests/host/check-not-windows-program.py

