      # madeira-bcd: ucrtbase-x64math.dll (env.MADEIRA_UCRT_X64_MATH): floor and sqrt as x64 code.
      - name: Check ucrt-x64-math
        run: python3 tests/host/check-ucrt-x64-math.py

