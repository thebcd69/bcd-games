      # madeira-bcd: size/index/end-of-file queries from one fstat (patched above, before ntdll-unix).
      - name: Check file-info-fstat
        run: python3 tests/host/check-file-info-fstat.py

      # madeira-bcd: env.MADEIRA_LEAN_DIAG (opt-in): no thread-suspending samplers, rare memory walks.
      - name: Check lean-diag
        run: python3 tests/host/check-lean-diag.py

      # madeira-bcd: env.MADEIRA_ECO_NATIVE (opt-in): the runtime's helper threads at utility QoS.
      - name: Check eco-native
        run: python3 tests/host/check-eco-native.py

      # madeira-bcd: the frame-cap power governor (opt-in: env.MADEIRA_FPS_CAP / MADEIRA_FPS_GOV_MW).
      - name: Check fps-gov
        run: python3 tests/host/check-fps-gov.py

      # madeira-bcd: env.MADEIRA_POWER_PROBE (opt-in): GPU, SoC and device power next to [xp].
      - name: Check power-probe
        run: python3 tests/host/check-power-probe.py

      # madeira-bcd: ntdll-sync.dll (tools/patch-wine-ntdll-sync.py), opt-in since build 499
      # (env.MADEIRA_NTDLL_SYNC = 1 maps it): cheaper SRW locks and critical sections.
      - name: Check ntdll-sync
        run: python3 tests/host/check-ntdll-sync.py

      # madeira-bcd, from thebcd69/bcd-games#4 and thebcd69/bcd-wine#1 by mckenna654 (Diablo II: Resurrected, build 598): five switches,
      # all off unless the game's own file sets them: env.MADEIRA_SHARED_SECTION_EXEC (an executable view of a pagefile section keeps its
      # shared memory), env.MADEIRA_NTDLL_XSEC (ntdll-xsec.dll, tools/patch-wine-ntdll-xsec.py: the emulator is told about it, and two
      # code-probe recoveries, one gated by env.MADEIRA_D2R_PROBE_RECOVERY), env.MADEIRA_NTDLL_DATA_SYNC_RANGE (a sub-page protect of
      # ntdll's .data copies only its bytes) and env.MADEIRA_FAULT_LOOP_GUEST_PROGRESS (breakpoints at different guest addresses are no
      # stuck thread). tests/x64/shared-section-x64.c is the device program for the first two.
      - name: Check the executable-section switches (D2R)
        run: |
          python3 tests/host/check-shared-section-exec.py
          python3 tests/host/check-ntdll-data-sync-range.py
          python3 tests/host/check-fault-loop-guest-progress.py
          python3 tests/host/check-ntdll-xsec.py

      # madeira-bcd: the Mach handler repairs a TEB access whose base an ADD computed from a
      # zeroed x18, also when the ADD wrote its own index register (HZD build 500).
      - name: Check x18-derived base
        run: python3 tests/host/check-x18-derived-base.py

      # madeira-bcd (round tur600): a page fault that has to wait for virtual_mutex says which fault it is before it waits ("[vm-fault-wait]",
      # build/ntdll-unix/virtual_ios.c). Seven logs of four games (OMORI, Demons Roots, Saints Row IV, ONE PIECE Bounty Rush) stop with a thread
      # parked in memset / memmove under NtFreeVirtualMemory or virtual_map_section and the Mach exception thread waiting for the mutex that
      # thread holds; the log never named the fault. Nothing else changes; the helper is cut out of the source and run on the host.
      - name: Check the vm-fault-wait line
        run: python3 tests/host/check-vm-fault-wait.py

      # BCD: EA redist processes reuse their WoW window/TEB addresses. A stale
      # exit handoff must never join self or free a replacement's live stack.
      - name: Check EA thread retirement
        run: python3 tests/host/check-ea-thread-reap.py

      # madeira-bcd: ... and also a sign-extending load (ldrsw x28, [x18, #0x180c]: FEX's WowTebOffset
      # read; Left 4 Dead 2 died of it after 200 s, FFXIV's WebView2 setup too, build 574).
      - name: Check x18 signed loads
        run: python3 tests/host/check-x18-signed-load.py

      # madeira-bcd: the WOW64 module's thread map is constructed when its static initialiser had no
      # effect (every 32-bit program on iOS 18 died in BTCpuThreadInit, build 574).
      - name: Check the WOW64 thread-map guard
        run: python3 tests/host/check-fex-wow-threads-ctor.py

      # madeira-bcd (round 624): the 32-bit FEX module translates 0x82, 0x80's 32-bit-only alias (Ubisoft Connect, South Park,
      # Assassin's Creed 2: "Unknown ALU Op: 0x10..0x16", c000001d, exit 0xdeadc0de); the patch on a copy of the pinned file, the
      # decode tables, the build wiring, the device test's compile, the trap's code bytes in [int3-guest], the auto-tune rule.
      - name: Check the FEX 0x82 alias
        run: python3 tests/host/check-fex-op82-alias.py

      # madeira-bcd: the WoW64 CPU module runs from its JIT-pool copy only where the kernel would let its PE
      # view execute next to it (iOS 18; the cause of the iOS 18 32-bit start failure, builds 573/574).
      - name: Check WoW64 CPU module pool-only execution
        run: python3 tests/host/check-wow-cpu-pool.py

      # madeira-bcd: bcd.cfg yield-mode (tools/patch-wine-yield-mode.py), opt-in.
      - name: Check yield-mode
        run: python3 tests/host/check-yield-mode.py

      # madeira-bcd: render-pass traffic (gpu-traffic counters, clear-defer;
      # opt-in rp-carry, rp-discard and its winemetal op 24, f6-rar).
      - name: Check render-pass traffic
        run: python3 tests/host/check-render-pass-traffic.py

      # madeira-bcd: FSR 3 frame-generation experiments (opt-in cs-split,
      # fi-setup-zero, fi-field-check: Horizon Forbidden West's black squares).
      - name: Check FidelityFX experiments
        run: python3 tests/host/check-ffx-experiments.py

      # madeira-bcd: default-buffer-swap (opt-in) and its -wire / -max-mb keys:
      # large committed DEFAULT buffers on file-backed storage.
      - name: Check default-buffer-swap
        run: python3 tests/host/check-default-buffer-swap.py

      # madeira-bcd: fence-poll-backoff (opt-in): GetCompletedValue without the lock,
      # and a thread spinning on an unchanged fence sleeps until it moves.
      - name: Check fence-poll-backoff
        run: python3 tests/host/check-fence-poll-backoff.py

      # madeira-bcd: fence-early (madeira-d3d12, off by default): a fence advances when the GPU
      # reached its batch; its command buffers retire on a second thread (Rift Apart, 556).
      - name: Check fence-early
        run: python3 tests/host/check-fence-early.py

      # madeira-bcd: write-buffer-immediate and query-timestamps (both opt-in, build 593): Marvel's Spider-Man
      # Remastered waits for a WriteBufferImmediate value; only its list and auto-tune rule turn them on.
      - name: Check write-buffer-immediate
        run: python3 tests/host/check-write-buffer-immediate.py

      # madeira-bcd: wow-reap (build 593): a 32-bit process that would get no guest window ends the leftover
      # threads of exited processes where they hold no host lock (Battle.net's Agent, build 592).
      - name: Check wow-reap
        run: python3 tests/host/check-wow-reap.py

      # madeira-bcd: an async I/O completion in a 32-bit process stores its IO_STATUS_BLOCK32 only where it can land (build 596). Battle.net's
      # Agent and AgentHelper (build 594), and cmd.exe children of Portal, Batman Arkham Asylum and LEGO Batman 2 (builds 579, 592): FEX's own
      # WriteFile writes rpmalloc's first log lines to a live console with an uninitialised 64-bit status block, and ntdll took it for a guest
      # one (0x10000). The decision compiled with counting probes, the real wrapper next to the original, the real probes on this Mac's
      # mappings, the sources' links, the auto-tune rule and fixtures.
      - name: Check the async I/O completion store into a 32-bit process
        run: python3 tests/host/check-iosb-dead-target.py

      # ajan18/bnet-cef: [int3-x86], an OPT-IN report for a 32-bit guest's int3 (env.MADEIRA_INT3_X86_DUMP = 1, Battle.net's launcher entry only):
      # the stack, the code, the modules and libcef.dll's CodeView record, to name the CHECK that ends Battle.net's Chromium renderers. Source
      # shape, "nothing changes when the switch is unset", compiled runs against a constructed 32-bit window (macOS), the launcher entry.
      - name: Check the 32-bit int3 report
        run: python3 tests/host/check-int3-x86-diag.py

      # ajan21/loglar: [ill-guest], the guest bytes FEX could not decode ("Invalid instruction in entry block": Jetboard Joust, build 592, seven
      # logs), printed with the same bytes through the JIT pool's alias when the dispatcher ends in SIGILL. Log only, no switch. Source shape,
      # compiled runs over real pages (plain, agreeing alias, differing alias, a block at the start of a mapped range, the cap), the iOS compile.
      - name: Check the ILL guest-bytes report
        run: python3 tests/host/check-ill-guest-diag.py

      # ajan21/loglar: [x86-fault], an OPT-IN report for a 32-bit guest's unhandled access violation or int3 (env.MADEIRA_X86_FAULT_DUMP = 1, the
      # lists of Need for Speed: Most Wanted and Underground 2 only): the code, the stack, the modules and the objects the registers point at.
      # Source shape, "nothing changes when the switch is unset", compiled runs against a constructed 32-bit window (macOS), the lists, the catalog.
      - name: Check the 32-bit fault report
        run: python3 tests/host/check-x86-fault-diag.py

      # ajan18/bnet-cef: env.MADEIRA_PROTECT_WRITECOPY_AS_RW (Battle.net's launcher entry only): VirtualProtect on a 32-bit program's writable image
      # data page, made read-only, reports PAGE_READWRITE (the value only), which V8's flag freeze checks (libcef.dll 108: Battle.net's renderers
      # ended on that int3). The evidence from the public libcef's bytes, the truth table of the change, the four pieces in virtual_ios.c, the
      # launcher entry, the auto-tune rule chromium-v8-flags-freeze-writecopy and its fixture.
      - name: Check the PAGE_WRITECOPY old protection (V8 flag freeze)
        run: python3 tests/host/check-wc-old-prot.py

      # ajan28/ozellik (2026-10-24): BCD Dock's Steam launch option. The game page lists the launch entries of Steam's configuration that a Dock
      # start can run and remembers the pick (LibraryEntry.steamLaunchOption); a game that never picked asks Valve's client for exactly the entry and
      # logs the line it did before (SteamDirectStart.dockLaunch against a verbatim copy of the old two lines). Fallout 4's configuration is one entry.
      - name: Check the Steam launch option of a Dock start
        run: python3 tests/host/check-dock-launch-option.py

      # ajan28/ozellik (2026-10-24): Fallout 4 (Steam 377160) through BCD Dock starts Fallout4.exe in place of its launcher: env.MADEIRA_SPAWN_SWAP
      # (opt-in; ios_spawn_swap.h compiled and run, the one call in process_ios.c, Fallout 4's list line with minBuild 598, the policy, the auto-tune rule
      # fallout-4-launcher-swap and its fixture).
      - name: Check the spawn swap (Fallout 4's launcher)
        run: python3 tests/host/check-spawn-swap.py

      # ajan22/loglar (2026-10-24): the Unity stop that follows a garbage collection. 31 logs of eight Unity titles answer the collector's
      # NtGetContextThread on its stopped threads with the Mach-O state and stop in a freed object's header a few dozen lines after the last burst
      # ([ec-getctx] ml715, [badrip]). The Wine server's old opt-in switch MADEIRA_CTX_FRAME (ml716: a thread parked in a system call is reported
      # by its saved call frame) is offered to that stop: No Rest for the Wicked's list from build 598, and the auto-tune rule
      # unity-gc-stopped-thread-context. This holds the server's gate, the list policy (0 or 1), the list line, the rule and its fixture.
      - name: Check the stopped-thread context switch for Unity's collector (MADEIRA_CTX_FRAME)
        run: python3 tests/host/check-ctx-frame-line.py

      # madeira-bcd: env.MADEIRA_ECO_PRIO (opt-in): under eco, threads that raise
      # themselves to TIME_CRITICAL (madeira-d3d12's workers) keep the performance cores.
      - name: Check eco-prio
        run: python3 tests/host/check-eco-prio.py

      # madeira-bcd: env.MADEIRA_WSEX_MINCORE (opt-in): QueryWorkingSetEx from mincore, and
      # madeira-d3d12's default-buffer-swap residency census.
      - name: Check wsex-mincore
        run: python3 tests/host/check-wsex-mincore.py

      # madeira-bcd: heap-untracked (opt-in, tools/patch-winemetal-heap-untracked.py).
      - name: Check heap-untracked
        run: python3 tests/host/check-heap-untracked.py

      # madeira-bcd: env.MADEIRA_SWAP_HEAT (opt-in): the swap tier's re-read census and
      # its filter for block sizes that keep paging back in.
      - name: Check swap-heat
        run: python3 tests/host/check-swap-heat.py

      # madeira-bcd (2026-10-28, build 622): in broad mode (swap-mode = 2) swap-mb caps the disk for commits into reservations
      # already in the file too, not only when a reservation is mapped (Spider-Man 2: 2,445 MB on the disk with swap-mb = 256).
      # Not the committed data (build 621): games commit several times what they write.
      - name: Check the swap-mb cap
        run: python3 tests/host/check-swap-cap.py

      # madeira-bcd (round 624; from rtmtree's fork bcd-games-persona): helper memory (mempool-mb, the ml1150 pool) spans its
      # regions, is asked before broad's disk cap, zeroes a decommit in place, merges freed space, counts free and file-backed
      # pages in its guard and ignores BCD's own limit warning; env.MADEIRA_POOL_MIN_KB and env.MADEIRA_POOL_FEX are opt-in.
      - name: Check helper memory
        run: python3 tests/host/check-helper-memory.py

      # madeira-bcd (build 623; upstream Madeira 726686e): a 32-bit program's branch to a low address faults in the guest
      # instead of ending the program (36 logs).
      - name: Check wow-low-rip
        run: python3 tests/host/check-wow-low-rip.py

      - name: Check DXMT GS/TS marshal loops
        run: python3 tests/host/check-dxmt-gsts-marshal.py

      - name: Check DXMT d3d9.customDriver and the GeForce 7900 GS card
        run: python3 tests/host/check-dxmt-d3d9-custom-driver.py

      # madeira-bcd (build 624, round 624: R.E.P.O. and other Unity games on Mono): an executable request outside the Wine view of its
      # nearest MZ page is not that image's tail (MADEIRA_MZ_VIEW_CHECK, build/ntdll-unix/ios_mz_view.h).
      - name: Check the MZ view check
        run: python3 tests/host/check-mz-view.py

      # madeira-bcd (build 624, round 624: Battle.net Y0HFHB, Garry's Mod): a 32-bit guest window is found by its reserving thread's
      # Darwin id, never by a pthread_t a dead thread left behind; the silent "already have one" branch logs how it found the window.
      - name: Check the 32-bit window owner
        run: python3 tests/host/check-wow-slot-owner.py

      # madeira-bcd (build 624, round 624: Garry's Mod, 8 of 8 logs): the committed aarch64 wow64.dll is byte-patched so a NULL SID from
      # NtQueryInformationToken (TokenAppContainerSid) is answered, not read (tools/patch-wow64-token-null-sid.py).
      - name: Check the patched wow64.dll
        run: python3 tests/host/check-wow64-token-null-sid.py

      # madeira-bcd (build 624, round 624): env.MADEIRA_STEAM_IDENTITY = none from a game's own file is checked after the game's env lines.
      - name: Check the Steam identity order
        run: python3 tests/host/check-steam-identity-order.py

      # madeira-bcd (build 624, round 624: LiveContainer, GTA V BTHD1F): the app's own __TEXT comes from the image that holds the code.
      - name: Check the app text range by dladdr
        run: python3 tests/host/check-app-text-dladdr.py

      # madeira-bcd (build 624, round 624: GTA V Legacy 71GQSA): pool-window-cut keeps the JIT pool clear of a window that was not held.
      - name: Check the pool window cut
        run: python3 tests/host/check-pool-window-cut.py

      # madeira-bcd: the ARM64EC JIT no longer maintains the call-ret shadow stack nothing reads on iOS
      # (MADEIRA_FEX_CALLRET_ELIDE=0 keeps it).
      - name: Check fex-callret-elide
        run: python3 tests/host/check-fex-callret-elide.py

      # madeira-bcd: guest calls into ARM64EC code leave the JIT with BLR and their returns re-enter it with
      # RET after an L1 probe (MADEIRA_FEX_EC_RET=0 keeps BR and the loop-top re-entry).
      - name: Check fex-ec-ret
        run: python3 tests/host/check-fex-ec-ret.py

      # madeira-bcd: the dispatcher's EC code check loads PEB->EcCodeBitMap from the thread's frame
      # (MADEIRA_FEX_EC_BITMAP_CACHE=0 keeps the TEB/PEB walk).
      - name: Check fex-ec-bitmap-cache
        run: python3 tests/host/check-fex-ec-bitmap-cache.py

      # madeira-bcd: JIT exits into ARM64EC code go through ExitFunctionECJit when AFP is off
      # (MADEIRA_FEX_EC_EXIT_LEAN=0 keeps ExitFunctionEC).
      - name: Check fex-ec-exit-lean
        run: python3 tests/host/check-fex-ec-exit-lean.py

      # madeira-bcd: IosJitReverseTranslate answers addresses outside every JIT copy without walking the table.
      - name: Check fex-alias-xlate-bounds
        run: python3 tests/host/check-fex-alias-xlate-bounds.py

      # madeira-bcd: RetToEntryThunk enters the JIT without its own EC code bitmap test
      # (MADEIRA_FEX_EC_RET_DIRECT=0 keeps it).
      - name: Check fex-ec-ret-direct
        run: python3 tests/host/check-fex-ec-ret-direct.py

      # madeira-bcd: FEX_MADEIRA_HOSTPROBE also reports LSE2, LRCPC3, FRINTTS, RPRES, CSSC, MOPS,
      # ECV and WFXT; FEX's parsers must keep reading every key exactly as published.
      - name: Check FEX host probe
        run: python3 tests/host/check-fex-hostprobe.py

      # madeira-bcd (round 623, Kindergarten 9DEZ8A / Mycopunk 997BBV / Skate Story XYPY9J): MonoBackpatcherWrite's alias-miss store runs
      # without CodeInvalidationMutex when MADEIRA_MONO_BP_UNLOCKED_MISS=1, so the access violation it raises leaves no write-owned mutex
      # behind ("[fexlock] STUCK write-wait", owner == waiter). Off by default; auto-tune's rule mono-backpatch-lock-leak adds the line.
      - name: Check fex-mono-bp-unlocked-miss
        run: python3 tests/host/check-fex-mono-bp-unlocked-miss.py

      # The native D3D12 runtime is ours to fix now, so build it from
      # madeira-d3d12 instead of shipping upstream's binary as is.
      # madeira-bcd: a failed build FAILS the run. It used to keep the tracked
      # DLL -- upstream's old binary without any of this fork's D3D12 fixes --
      # and the run still went green, so a broken build could reach the phone.
      # madeira-bcd (iOS 18 audit): the helper kernels get a second copy at AIR 2.7,
      # loaded only where the first is refused (iOS 18); iOS 26 and later unchanged.
      - name: Check D3D12 helper kernels for iOS 18
        run: python3 tests/host/check-metal-kernels-ios18.py

      - name: Build madeira_d3d12.dll from source
        env:
          MAD_BUILD_ID: ipa ${{ steps.bn.outputs.n }}
        run: bash tools/build-madeira-d3d12-dll.sh

      # BCD's Direct3D 9, 10 and 11 test programs for the Wine desktop's Start menu, next to the Direct3D 12 one the step above
      # builds: plain C for x86-64 Windows, shaders as bytecode in the repository. A build that fails keeps the tracked program.
      - name: Build the Direct3D 9, 10 and 11 test programs
        continue-on-error: true
        run: bash tools/build-dx-tests.sh

      # BCD's system tests (tests/systests/systest.c): bcd-systest-x64.exe into arm64ec-windows and bcd-systest-x86.exe into the
      # i386 farm's folder (after the farm, so its cache does not carry it). A build that fails keeps the tracked programs.
      - name: Build the system test programs (x64 and x86)
        continue-on-error: true
        run: bash tools/build-systests.sh

      # BCD's runtime installer (bcd-runtimes/runtimes.c, round 603): bcd-runtimes-x64.exe into arm64ec-windows, after the farm. A build that
      # fails keeps the tracked program.
      - name: Build the runtime installer (bcd-runtimes-x64.exe)
        continue-on-error: true
        run: bash tools/build-bcd-runtimes.sh

      # BCD's start helper (bcd-helper/helper.c, round 604): bcd-helper-x64.exe into arm64ec-windows, after the farm. A build that fails
      # keeps the tracked program.
      - name: Build the start helper (bcd-helper-x64.exe)
        continue-on-error: true
        run: bash tools/build-bcd-helper.sh

      # BCD's winebrowser.exe (bcd-openurl/, round 625, the owner's item 23): what a Windows program runs to open a web page; the app
      # asks the player. x86-64 into arm64ec-windows, aarch64 into aarch64-windows, i686 into the i386 farm in place of Wine's own (after
      # the farm). A build that fails keeps the tracked programs; the check after it says whether each farm has BCD's.
      - name: Build BCD's winebrowser.exe (three farms)
        continue-on-error: true
        shell: bash
        run: |
          bash tools/build-bcd-openurl.sh
          for f in app/Madeira/arm64ec-windows/winebrowser.exe app/Madeira/aarch64-windows/winebrowser.exe app/Madeira/i386-windows/winebrowser.exe; do
            if [ -f "$f" ] && LC_ALL=C grep -aq "\[open-url\] madeira-bcd" "$f"; then echo "::notice::$f is BCD's"; else echo "::warning::$f is not BCD's winebrowser.exe"; fi
          done

      # 7-Zip 26.05 from the pinned release (third-party/7zip), without its RAR code: 7zFM.exe (the File Manager) and 7z.exe, x86-64
      # Windows programs next to Wine's programs in arm64ec-windows. About ten minutes; a build that fails keeps the tracked programs.
      - name: Build 7-Zip (7zFM.exe and 7z.exe, without the RAR code)
        continue-on-error: true
        run: bash tools/build-7zip.sh

      # DXMT's NVAPI (dxmt/src/nvapi), which its DXMT build leaves
      # out; answers games that want a known vendor's driver version once the
      # library's "Report an NVIDIA GPU" switch sets DXMT_ENABLE_NVEXT=1.
      - name: Build DXMT nvapi64.dll
        continue-on-error: true
        run: bash tools/build-dxmt-nvapi.sh

      # Upstream ships no faultrep.dll; games that import it (Ghost of
      # Tsushima) fail in the loader with STATUS_DLL_NOT_FOUND.
      - name: Build faultrep.dll
        continue-on-error: true
        run: bash tools/build-faultrep-dll.sh

      # The Agility SDK half of D3D12 (D3D12SDKVersion + forwarders to
      # d3d12.dll). GTA V Enhanced under Proton loads d3d12core.dll right
      # after d3d12.dll; only bcd.cfg d3d12-core-dll makes ours load it.
      - name: Build d3d12core.dll
        continue-on-error: true
        run: bash tools/build-d3d12core-dll.sh

      # Wine PE DLLs upstream does not ship but games import (VC++ 2002-2012
      # runtimes, D3DX9/10/11, d3d10, avifil32, XAudio2, dinput), built from
      # the wine submodule for arm64ec. Never replaces a shipped DLL.
      - name: Restore wine arm64ec build
        id: wineeccache
        uses: actions/cache/restore@v4
        with:
          path: wine/build-arm64ec
          key: wine-arm64ec-${{ steps.winerev.outputs.sha }}-v1

      - name: Build extra Wine DLLs for arm64ec
        continue-on-error: true
        run: bash tools/build-wine-extra-dlls.sh "$GITHUB_WORKSPACE/wine/build-native"

      # Launcher error117 in406: WMVCORE.DLL was never packaged. Its genuine
      # Wine reader imports winegstreamer; both must build despite the optional
      # handling of unrelated extra DLLs above. Do not ship another missing farm.
      - name: Verify Wine media reader DLLs
        run: python3 tools/check-wine-media-dlls.py app/Madeira/arm64ec-windows

      # Round 624 (agent E2 S3): the step that builds the opt-in DLLs may fail without failing the build; a DLL a game list or an
      # auto-tune rule names in env.MADEIRA_OPTIN_DLLS (Glyphica's kernelbase-optin.dll, build 624) must not go missing silently.
      - name: Verify the opt-in DLLs the lists and rules name
        run: python3 tools/check-optin-dlls-shipped.py app/Madeira/arm64ec-windows

      - name: Save wine arm64ec build
        if: steps.wineeccache.outputs.cache-hit != 'true' && hashFiles('wine/build-arm64ec/dlls/msvcr80/arm64ec-windows/msvcr80.dll') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: wine/build-arm64ec
          key: wine-arm64ec-${{ steps.winerev.outputs.sha }}-v1

      # d3d10/avifil32/vulkan-1 stand-ins from Wine's .spec export lists:
      # Crysis Remastered imports all three and fails to load without them.
      - name: Build stand-in DLLs (d3d10, avifil32, vulkan-1)
        continue-on-error: true
        run: |
          M=toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin
          python3 tools/build-stub-dlls.py wine build/stub-dlls "$M/arm64ec-w64-mingw32-clang" \
            "$M/llvm-readobj" app/Madeira/arm64ec-windows

      # The PE-side DXMT DLLs (d3d11/dxgi/winemetal/d3d10core) are committed
      # under app/Madeira/aarch64-windows/ despite the README calling them
      # gitignored, so there is nothing to build here -- just confirm they
      # are present before we try to archive.
      - name: Verify committed PE DLLs
        shell: bash
        run: |
          MISSING=""
          for d in d3d11.dll dxgi.dll winemetal.dll d3d10core.dll; do
            [ -f "app/Madeira/aarch64-windows/$d" ] || MISSING="$MISSING aarch64/$d"
          done
          # srvcli.dll comes from the extra Wine DLL build: Microsoft Flight
          # Simulator 2024's program does not load without it (build 534).
          for d in d3d11.dll dxgi.dll winemetal.dll d3d12.dll madeira_d3d12.dll xtajit64.dll ntdll.dll srvcli.dll; do
            [ -f "app/Madeira/arm64ec-windows/$d" ] || MISSING="$MISSING arm64ec/$d"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::PE DLLs missing from app/Madeira ::$MISSING"
            exit 1
          fi
          echo "::notice::all PE DLLs present"
          # The ARM64EC source build permits a fallback on failure. This
          # allocator change requires its rebuilt module before archiving.
          python3 - <<'PYEOF'
          from pathlib import Path
          module = Path('app/Madeira/arm64ec-windows/xtajit64.dll').read_bytes()
          if b'rpmalloc-span4 madeira-bcd' not in module:
              raise SystemExit('Required ARM64EC rpmalloc span4 module was not built; refusing the fallback IPA')
          if b'branch-history-v1 madeira-bcd' not in module or b'IosGuestBranchTraceLayout' not in module:
              raise SystemExit('Required ARM64EC branch-history module was not built; refusing the fallback IPA')
          if b'launcher-smc-v1 madeira-bcd' not in module:
              raise SystemExit('Required ARM64EC Launcher SMC module was not built; refusing the fallback IPA')
          if b'smc-store-fastpath-v1 madeira-bcd' not in module:
              raise SystemExit('Required ARM64EC SMC store fast-path module was not built; refusing the fallback IPA')
          if b'callret-elide-v1 madeira-bcd' not in module:
              raise SystemExit('Required ARM64EC call-ret elision module was not built; refusing the fallback IPA')
          if b'ec-ret-v1 madeira-bcd' not in module:
              raise SystemExit('Required ARM64EC EC-return module was not built; refusing the fallback IPA')
          if b'ec-bitmap-cache-v1 madeira-bcd' not in module:
              raise SystemExit('Required ARM64EC EC-bitmap cache module was not built; refusing the fallback IPA')
          if b'ec-exit-lean-v1 madeira-bcd' not in module:
              raise SystemExit('Required ARM64EC lean JIT exit module was not built; refusing the fallback IPA')
          if b'ec-ret-direct-v1 madeira-bcd' not in module:
              raise SystemExit('Required ARM64EC direct return module was not built; refusing the fallback IPA')
          print('ARM64EC rpmalloc: span4 build marker verified')
          PYEOF
          # Verify the linked x64 entries; never silently ship a fallback DLL
          # that accepts the option but lacks the required interop ABI.
          python3 tests/host/check-x64-graphics-entry.py \
            --factory app/Madeira/arm64ec-windows/dxgi-src.dll \
            --d3d12 app/Madeira/arm64ec-windows/madeira_d3d12.dll
          # Likewise tools/build-d3d11-dll.sh (env.MADEIRA_D3D11_SRC). Round 620: BCD's Direct3D 11
          # patches reach a 64-bit game only through d3d11-src.dll, and recommended lists ask for it
          # (F1 2020), so an IPA in which no 64-bit d3d11.dll carries them is refused.
          NEED=""
          # Round 624: Dark Souls III's [srv-getdesc] and WRC 9's [query-stuck] too (build 624's first IPA shipped a
          # d3d11-src.dll without the second: tools/build-d3d11-dll.sh's BCD_PATCHES did not name it).
          for m in "[copy-structure-count] skipped #" "[rtv-fail] #" "[srv-getdesc] madeira-bcd #" "[query-stuck] madeira-bcd query="; do
            LC_ALL=C grep -aqF "$m" app/Madeira/arm64ec-windows/d3d11.dll && continue
            [ -f app/Madeira/arm64ec-windows/d3d11-src.dll ] && LC_ALL=C grep -aqF "$m" app/Madeira/arm64ec-windows/d3d11-src.dll && continue
            NEED="$NEED \"$m\""
          done
          if [ -n "$NEED" ]; then
            echo "::error::no 64-bit d3d11.dll carries BCD's Direct3D 11 patches ($NEED): tools/build-d3d11-dll.sh did not ship d3d11-src.dll (see its step)"
            exit 1
          fi
          if [ -f app/Madeira/arm64ec-windows/d3d11-src.dll ]; then
            echo "::notice::d3d11-src.dll present ($(wc -c < app/Madeira/arm64ec-windows/d3d11-src.dll | tr -d ' ') bytes): env.MADEIRA_D3D11_SRC = 1 selects it"
          elif LC_ALL=C grep -aqF "madeira-bcd: SwapDeviceContextState in use" app/Madeira/arm64ec-windows/d3d11.dll; then
            echo "::notice::no d3d11-src.dll: upstream's d3d11.dll carries SwapDeviceContextState itself (dxmt pin 2026-10-15 and later); env.MADEIRA_D3D11_SRC = 1 keeps it"
          else
            echo "::warning::d3d11-src.dll missing: this IPA has only upstream's d3d11.dll (no SwapDeviceContextState); env.MADEIRA_D3D11_SRC = 1 does nothing"
          fi
          # And tools/build-wine-extra-dlls.sh's ucrtbase-x64math.dll
          # (env.MADEIRA_UCRT_X64_MATH): never ship one whose four exports are
          # not the x64 bodies.
          if [ -f app/Madeira/arm64ec-windows/ucrtbase-x64math.dll ]; then
            python3 tools/patch-wine-ucrtbase-x64-math.py --verify app/Madeira/arm64ec-windows/ucrtbase-x64math.dll
          else
            echo "::warning::ucrtbase-x64math.dll missing: env.MADEIRA_UCRT_X64_MATH = 1 does nothing in this IPA"
          fi
          # And its kernelbase-fibertrace.dll (env.MADEIRA_FIBER_TRACE): never ship
          # one without the trace or with other exports than the shipped kernelbase.dll.
          if [ -f app/Madeira/arm64ec-windows/kernelbase-fibertrace.dll ]; then
            python3 tools/patch-wine-kernelbase-fibertrace.py --verify app/Madeira/arm64ec-windows/kernelbase-fibertrace.dll \
              app/Madeira/arm64ec-windows/kernelbase.dll
          else
            echo "::warning::kernelbase-fibertrace.dll missing: env.MADEIRA_FIBER_TRACE = 1 does nothing in this IPA"
          fi
          # And its setupapi-optin.dll (env.MADEIRA_OPTIN_DLLS = setupapi): never ship one without the
          # device node lock or with other exports than the shipped setupapi.dll.
          if [ -f app/Madeira/arm64ec-windows/setupapi-optin.dll ]; then
            python3 tools/patch-wine-setupapi-devinst-lock.py --verify app/Madeira/arm64ec-windows/setupapi-optin.dll \
              app/Madeira/arm64ec-windows/setupapi.dll
          else
            echo "::warning::setupapi-optin.dll missing: env.MADEIRA_OPTIN_DLLS = setupapi does nothing in this IPA"
          fi
          # And the ASF source of env.MADEIRA_OPTIN_DLLS = mfasfsrcsnk,wmvdecod,wmadmod (Resident Evil 2/7): never ship the
          # handler without the winedmo patch (an unpatched one hands the game to the generic handler, which cannot read ASF).
          if [ -f app/Madeira/arm64ec-windows/mfasfsrcsnk-optin.dll ]; then
            python3 tools/patch-wine-mfasfsrcsnk-winedmo.py --verify app/Madeira/arm64ec-windows/mfasfsrcsnk-optin.dll
          else
            echo "::warning::mfasfsrcsnk-optin.dll missing: env.MADEIRA_OPTIN_DLLS = mfasfsrcsnk does nothing in this IPA"
          fi
          for d in winedmo.dll wmvdecod-optin.dll wmadmod-optin.dll; do
            [ -f "app/Madeira/arm64ec-windows/$d" ] || echo "::warning::$d missing: Resident Evil 2's cutscenes still end the game in this IPA"
          done
          # And its ntdll-sync.dll, which the unix loader maps by default: never
          # ship one whose SRW and critical-section exports are not the x64 bodies
          # or whose exports are not the shipped ntdll.dll's plus madeira_sync_x64_off.
          if [ -f app/Madeira/arm64ec-windows/ntdll-sync.dll ]; then
            python3 tools/patch-wine-ntdll-sync.py --verify app/Madeira/arm64ec-windows/ntdll-sync.dll \
              app/Madeira/arm64ec-windows/ntdll.dll
          else
            echo "::warning::ntdll-sync.dll missing: every game maps the shipped ntdll.dll"
          fi
          # And ntdll-xsec.dll (thebcd69/bcd-games#4), mapped only by a game with env.MADEIRA_NTDLL_XSEC = 1
          # (Diablo II: Resurrected): an ARM64EC image with the marker, the three log strings and the shipped ntdll.dll's exports.
          if [ -f app/Madeira/arm64ec-windows/ntdll-xsec.dll ]; then
            python3 tools/patch-wine-ntdll-xsec.py --verify app/Madeira/arm64ec-windows/ntdll-xsec.dll \
              app/Madeira/arm64ec-windows/ntdll.dll
          else
            echo "::warning::ntdll-xsec.dll missing: Diablo II: Resurrected's env.MADEIRA_NTDLL_XSEC = 1 maps the shipped ntdll.dll"
          fi

      # tools/fetch-vcruntime.md: the VC++ runtime DLLs (twelve, and since
      # 2026-10-09 MFC's mfc140.dll and mfc140u.dll from the same package:
      # Horizon Zero Dawn imports mfc140.dll) are Microsoft's
      # and are not redistributable under this project's license, so they are
      # gitignored and "you supply them yourself". Fetching them straight from
      # Microsoft at build time honours that -- nothing Microsoft-authored ever
      # enters this repository or its history. The files are copied
      # byte-for-byte; nothing is repacked or re-signed.
      #
      # Not with 7zz, though, whatever the doc says. It reports the download as
      #   Type = PE   CPU = x86   Image Size = 495616   InternalName: setup
      # for a 25 MB file: this is a WiX Burn bundle, a half-megabyte setup stub
      # with the real payload appended after the PE image as an attached
      # container. 7zz only ever sees the stub, so it unpacks 40 files of
      # sections and resources and none of the DLLs -- and the doc's
      # .rsrc/1033/CABINET path belongs to the pre-2015 layout, which this
      # package no longer has at all.
      #
      # cabextract is built for exactly this: it scans a file for embedded
      # cabinet headers rather than trusting its container format.
      - name: Check the VC++ runtime list and the MFC switch
        run: python3 tests/host/check-vcruntime-mfc.py

      # madeira-bcd (round 591): MFC for a game BCD Dock starts (env.MADEIRA_MFC_DOCK = 1), linked into sysx64.
      - name: Check MFC in a BCD Dock session
        run: python3 tests/host/check-mfc-dock.py

      # madeira-bcd (2026-10-23): env.MADEIRA_FEX_AVX = 2, AVX reported without AVX2 (FEX CPUID; Bink 2 video in Spider-Man 2).
      - name: Check AVX without AVX2
        run: python3 tests/host/check-fex-avx-no-avx2.py

      - name: Fetch the VC++ runtime DLLs from Microsoft
        shell: bash
        run: |
          set +e
          shopt -s nullglob
          DEST="$GITHUB_WORKSPACE/app/Madeira/x86_64-vcruntime"
          WANT="concrt140.dll msvcp140.dll msvcp140_1.dll msvcp140_2.dll
                msvcp140_atomic_wait.dll msvcp140_codecvt_ids.dll vcamp140.dll
                vccorlib140.dll vcomp140.dll vcruntime140.dll vcruntime140_1.dll
                vcruntime140_threads.dll mfc140.dll mfc140u.dll"
          NWANT=$(echo $WANT | wc -w | tr -d ' ')
          command -v cabextract >/dev/null 2>&1 || brew install cabextract
          command -v msiextract >/dev/null 2>&1 || brew install msitools

          curl -fL --retry 3 --retry-delay 2 -o /tmp/vcr.exe \
            https://aka.ms/vs/17/release/vc_redist.x64.exe
          if [ ! -s /tmp/vcr.exe ]; then
            echo "::warning::VC_redist.x64.exe download failed -- MSVC games will not start"
            exit 0
          fi
          echo "downloaded $(wc -c < /tmp/vcr.exe | tr -d ' ') bytes"

          rm -rf /tmp/vcx; mkdir -p /tmp/vcx/a /tmp/vcx/carve
          cabextract -q -d /tmp/vcx/a /tmp/vcr.exe 2>&1 | tail -3

          # Only if the scan came up empty: carve every cabinet out by its
          # MSCF header and its own declared length.
          if [ "$(find /tmp/vcx/a -type f | wc -l | tr -d ' ')" -lt 2 ]; then
            python3 - <<'PYEOF'
          import struct
          d = open('/tmp/vcr.exe', 'rb').read()
          n = off = 0
          while True:
              i = d.find(b'MSCF', off)
              if i < 0:
                  break
              cb = struct.unpack_from('<I', d, i + 8)[0] if i + 36 <= len(d) else 0
              if 1000 < cb <= len(d) - i:
                  open('/tmp/vcx/carve/c%d.cab' % n, 'wb').write(d[i:i + cb])
                  n += 1
                  off = i + cb
              else:
                  off = i + 4
          print('carved %d cabinet(s) by MSCF header' % n)
          PYEOF
          fi

          # The payloads are named <name>.dll_amd64 and <name>.dll_arm64 --
          # not <name>.dll, and not the F_CENTRAL_<name>_x64 an MSI cab would
          # use. Rather than chase the spelling, read each candidate's PE
          # header and take the one whose machine field is AMD64 (0x8664).
          # Picking up the arm64 build by mistake would fail silently: FEX
          # emulates x86-64, so an ARM64 DLL is the wrong binary in a file
          # with the right name.
          is_x64() {
            python3 -c "
          import struct, sys
          d = open(sys.argv[1], 'rb').read()
          pe = struct.unpack_from('<I', d, 0x3c)[0] if len(d) > 0x40 else 0
          ok = d[pe:pe+4] == b'PE\\0\\0' and struct.unpack_from('<H', d, pe+4)[0] == 0x8664
          sys.exit(0 if ok else 1)" "$1" 2>/dev/null
          }

          collect() {
            FOUND=0; MISSING=""
            for d in $WANT; do
              base="${d%.dll}"
              src=""
              while IFS= read -r cand; do
                if is_x64 "$cand"; then src="$cand"; break; fi
              done < <(find /tmp/vcx -type f \
                         \( -iname "$base.dll*" -o -iname "F_CENTRAL_${base}_*" \) \
                         -print 2>/dev/null)
              if [ -n "$src" ]; then
                cp "$src" "$DEST/$d" && FOUND=$((FOUND+1))
              else
                MISSING="$MISSING $d"
              fi
            done
          }

          # Peel containers until all of them turn up, or nothing new appears.
          for pass in 1 2 3 4; do
            BEFORE=$(find /tmp/vcx -type f 2>/dev/null | wc -l | tr -d ' ')
            find /tmp/vcx -type f -size +20k 2>/dev/null | while IFS= read -r f; do
              case "${f##*/}" in *.dll|*.DLL|*.exe|*.EXE|*_amd64|*_arm64|*_x86) continue ;; esac
              [ -d "$f.d" ] && continue
              mkdir -p "$f.d"
              cabextract -q -d "$f.d" "$f" > /dev/null 2>&1 \
                || msiextract -C "$f.d" "$f" > /dev/null 2>&1 \
                || rmdir "$f.d" 2>/dev/null
            done
            AFTER=$(find /tmp/vcx -type f 2>/dev/null | wc -l | tr -d ' ')
            collect
            echo "pass $pass: $BEFORE -> $AFTER files, $FOUND of $NWANT recovered"
            [ "$FOUND" -eq "$NWANT" ] && break
            [ "$BEFORE" = "$AFTER" ] && break
          done

          echo "::notice::vcruntime :: recovered $FOUND of $NWANT$([ -n "$MISSING" ] && echo " -- missing:$MISSING")"

          if [ "$FOUND" -lt "$NWANT" ]; then
            echo "-- what the installer actually unpacked to (biggest 40) --"
            find /tmp/vcx -type f -size +20k -exec ls -S {} + 2>/dev/null \
              | head -40 | sed "s|/tmp/vcx/||"
          fi

          # tools/fetch-vcruntime.md: a truncated certificate table means the
          # file is no longer an unmodified Microsoft binary.
          python3 - "$DEST"/*.dll <<'PYEOF' || true
          import struct, sys
          for path in sys.argv[1:]:
              d = open(path, 'rb').read()
              pe = struct.unpack_from('<I', d, 0x3c)[0]
              off, size = struct.unpack_from('<II', d, pe + 24 + 112 + 4*8)
              ok = size and off + size <= len(d)
              print(('  signed  ' if ok else '  UNSIGNED'), path.split('/')[-1])
          PYEOF

      # BCD: the app's own download of the same DLLs, for builds that do not bundle
      # them (VCRuntimeDownload.swift, BCDCab.c): the cabinet reader refuses damaged
      # input, the app's extractor takes these fourteen files byte for byte out of
      # /tmp/vcr.exe, and a session links the bundle's copy first (WineProcessBridge.m).
      - name: Check the in-app VC++ runtime download
        run: python3 tests/host/check-vcruntime-download.py --require-swift

      # BCD (round 625, the owner's item 26): the same download for Microsoft's 32-bit package, whose four MFC DLLs a 32-bit game gets
      # with env.MADEIRA_MFC32 = 1. The package is fetched here only for the check (into /tmp, never shipped: every device downloads its
      # own copy from Microsoft); without it the check runs on its synthetic package alone.
      - name: Check the 32-bit MFC download and its session links
        shell: bash
        run: |
          curl -fsSL --retry 3 --retry-delay 2 --proto '=https' --proto-redir '=https' --max-filesize 134217728 -o /tmp/vcr-x86.exe \
            https://aka.ms/vs/17/release/vc_redist.x86.exe || { rm -f /tmp/vcr-x86.exe; echo "::warning::vc_redist.x86.exe not downloaded: the MFC check uses its synthetic package"; }
          python3 tests/host/check-mfc32.py --require-swift

      # madeira-bcd (upstream port 2026-10-25): PrefixExtractor.c refuses '..' components, absolute paths and a bad tar size field;
      # PrefixExtractor.c built on the host with zlib and sanitizers, given synthetic archives and the bundled prefix template.
      - name: Check the prefix tarball extractor
        run: python3 tests/host/check-prefix-extract.py

      # madeira-bcd (upstream port 2026-10-25): wineserver's alloc_shared_object rounds a shared object to 8 bytes so the next object's
      # 64-bit sequence store is aligned on ARM64 (SimCity 4 Deluxe); the production allocator under ASan/UBSan.
      - name: Check wineserver shared object alignment
        run: python3 tests/host/check-session-object-alignment.py

      # madeira-bcd (upstream port 2026-10-25): the ntdll build probes the iPhoneOS SDK for rusage_info_v6.ri_page_wait_time_mach; the
      # [xp] line's pgw= reads -1.0 when the member is absent.
      - name: Check the rusage SDK probe
        run: python3 tests/host/check-rusage-sdk.py

      # madeira-bcd (upstream port 2026-10-25): wine_process_exit_code() (the guest's exit status, release/acquire, also for a session
      # ended off the boot thread) and the JITAllocator early-VA accessors for Swift 6; the accessors built on the host, both files
      # syntax-checked with the iPhoneOS SDK.
      - name: Check wine_process_exit_code and the early VA accessors
        run: python3 tests/host/check-wine-exit-code.py

      # madeira-bcd (upstream port 2026-10-25): MADEIRA_ENV_LOCKED, a host's list of environment names that bcd.cfg's and a game's env.*
      # lines may not replace; off unless a host sets it; the matcher built on the host.
      - name: Check MADEIRA_ENV_LOCKED
        run: python3 tests/host/check-env-locked.py

      # madeira-bcd (upstream port 2026-10-25): the guest's stdin and stdout on pipes and a forced console, all opt-in
      # (env.MADEIRA_STDIN_PIPE, env.MADEIRA_STDOUT_PIPE, env.MADEIRA_FORCE_CONSOLE, or Documents/bcd-stdin.txt, bcd-stdout.txt, bcd-
      # console.txt); the accessors run over real pipes.
      - name: Check the guest stdin and stdout pipes
        run: python3 tests/host/check-guest-pipes.py

      # madeira-bcd (upstream port 2026-10-25): the VC++ overlay takes only .dll files and also Microsoft's fourteen names from
      # Documents/vcruntime (the list builder compiled on the host); tools/fetch-vcruntime.sh gives, from the build's own download, the
      # same fourteen DLLs byte for byte; tests/host/check-vcruntime.py on synthetic folders.
      - name: Check the VC++ runtime sources and tools/fetch-vcruntime.sh
        run: python3 tests/host/check-vcruntime-sources.py

      # madeira-bcd (upstream port 2026-10-25): a Steam request whose connection closes while it is being sent is resumed once (the
      # production SteamSession.swift with a stand-in connection; callServiceMethod, sendAndWait and sendAndWaitPICS).
      - name: Check SteamSession's pending jobs
        run: python3 tests/host/check-steam-session-jobs.py

      # madeira-bcd (upstream port 2026-10-25): Steam Cloud sync decisions on the production code, the Steam Cloud saves switch off
      # stops every check, transfer and Play prompt (BCD's Accounts settings), turning it back on starts clean, and save transfers
      # always go over https.
      - name: Check Steam Cloud
        run: python3 tests/host/check-steam-cloud.py

      # madeira-bcd (upstream port 2026-10-25): SteamRemoteCache, which rewrites the list Valve's client answers Steam Cloud API saves
      # from, compiled on the host over temporary prefixes; off in BCD unless env.MADEIRA_STEAM_CLOUD_REMOTECACHE is set.
      - name: Check Valve's client's remotecache.vdf
        run: python3 tests/host/check-steam-remotecache.py

      # madeira-bcd (upstream port 2026-10-25): the Steam game language (depots, install record, DLC depots, device mapping) and the
      # download and install sizes, on the production app info and record writer; English unless a language is chosen.
      - name: Check the Steam game language
        run: python3 tests/host/check-steam-language.py --require-swift

      # madeira-bcd (upstream port 2026-10-25): env.MADEIRA_ARENA_GUARD = 1 keeps a fixed or hinted guest reservation (and the steering
      # valve's top slot) out of the FEX arena; off unless set; the guard cut out of virtual_ios.c and run on the host.
      - name: Check the FEX arena guard
        run: python3 tests/host/check-arena-guard.py

      # madeira-bcd (upstream port 2026-10-25): env.MADEIRA_EXE_WINDOW_HANDOFF = 1 hands the fixed base to a relaunched copy of the same
      # program and rounds the claim's size; off unless set; the window code run on the host.
      - name: Check the executable window handoff
        run: python3 tests/host/check-exe-window-handoff.py

      # madeira-bcd (upstream port 2026-10-25): exe-window-auto (the window measured from the game's folder) and pool-above-window (the
      # game's pool line, the pair above the window), both off unless set; fixedBaseWindowMB run on synthetic PE headers.
      - name: Check the executable window from the game's folder and the pool above it
        run: python3 tests/host/check-exe-window-auto.py --require-swift

      # madeira-bcd (upstream port 2026-10-25): env.MADEIRA_THIN_RESERVE = 1 gives 1-2 GB read-write reserves a thin head (a game that
      # reserves dozens of 1 GB blocks and commits little); off unless set; the switch run on the host, the hooks read.
      - name: Check thin reservations
        run: python3 tests/host/check-thin-reserve.py

      # madeira-bcd (upstream port 2026-10-25): env.MADEIRA_IMAGE_LOW_ALIAS = 1 (the narrowed form of an image's address gets a name)
      # and env.MADEIRA_QUERY_CLIP = 1 (VirtualQuery calls only allocatable memory free); both off unless set; the switches and the pure
      # parts run on the host.
      - name: Check the image low alias and the query clip
        run: python3 tests/host/check-query-clip.py

      # madeira-bcd (upstream port 2026-10-25): env.MADEIRA_KUSER_KEEP_REGS = 1 leaves registers that only look like KUSER pointers
      # alone after the sub-floor service emulated the access; off unless set; the step's condition run on the host for every
      # combination.
      - name: Check the KUSER register switch
        run: python3 tests/host/check-kuser-keep-regs.py

      # madeira-bcd (upstream port 2026-10-25): env.MADEIRA_AUDIO_IO_MS asks the audio session for a smaller IO buffer and the driver
      # reports an engine period of at least two slices (a client that queues one period); off unless set, GetDevicePeriod answers 10 ms
      # as before; the driver's period code run on the host.
      - name: Check the audio engine period
        run: python3 tests/host/check-audio-period.py

      # madeira-bcd (upstream port 2026-10-25): the session sets DXMT_CENSUS_THROTTLE=1 (one [mem-census] report every 10 s; a memory
      # warning and the first report always); env.DXMT_CENSUS_THROTTLE = 0 undoes it; the app's line and, with the DXMT sources, DXMT's
      # side read.
      - name: Check DXMT's memory census throttle
        run: python3 tests/host/check-census-throttle.py

      # madeira-bcd (upstream port 2026-10-25): env.MADEIRA_THERMAL_CAP = 1 (off by default) caps a hot device at 40 FPS and gives the
      # session's mode back at nominal; the production ThermalPacing run on the host with the thermal notification posted for real.
      - name: Check the thermal frame cap
        run: python3 tests/host/check-thermal-cap.py --require-swift

      # madeira-bcd (upstream port 2026-10-25): env.MADEIRA_THREAD_QOS = pattern=class;... gives a guest thread a QoS class by its name
      # (off unless set; sync.c's QoS call goes through a wrapper that passes through without a rule); the rule parser, matcher, table
      # and wrapper run on the host.
      - name: Check the QoS class per thread name
        run: python3 tests/host/check-thread-qos.py

      # madeira-bcd (upstream port 2026-10-25): a Steam discovery value in the registry that names a client no longer there (a Steam
      # emulator's or a removed client's leftover) is replaced, a live client stays a conflict, and the failure line says what stopped
      # the setup; the production ZIP reader and registry writer run on the host.
      - name: Check BCD Dock's client components setup
        run: python3 tests/host/check-dock-components.py

      # madeira-bcd (upstream port 2026-10-25): the window census of a Dock start under AddressSanitizer and ThreadSanitizer, the born-
      # minimized restore, and env.MADEIRA_RESTORE_BORN_MINIMIZED_LATE = 1 (the restore goes on after the starting screen; off unless
      # set, where 2 ends the census like 0); the decision rules compiled with swiftc.
      - name: Check BCD Dock's starting-screen census
        run: python3 tests/host/check-dock-start-screen.py

      # madeira-bcd (upstream port 2026-10-25): the key bar's Paste button and the opt-in Command-V type the clipboard as key and text
      # events in order; pure paste types, the text event queue and the BCD wiring.
      - name: Check clipboard text paste
        run: python3 tests/host/check-clipboard-paste.py

      # The directory has to exist or xcodebuild fails the archive outright,
      # but the DLLs themselves are Microsoft's and cannot be committed.
      - name: Report vcruntime contents
        shell: bash
        run: |
          shopt -s nullglob
          DLLS=(app/Madeira/x86_64-vcruntime/*.dll)
          echo "x86_64-vcruntime DLLs present: ${#DLLS[@]} of 14 (12 C++ runtime + MFC's 2)"
          if [ "${#DLLS[@]}" -lt 14 ]; then
            echo "::warning::IPA will build, but games built with MSVC will not \
          start until the VC++ runtime DLLs are added -- see tools/fetch-vcruntime.md"
          fi

      # Upstream's Built-in StikJIT pairs with the device itself (app/Madeira/
      # JITPairing.swift, the MadeiraJITHelper extension); the app target links
      # this Rust static library. Dependencies come from crates.io at the
      # versions in Cargo.lock; the step regenerates the bundled licence notices.
      - name: Build libmadeira_rppairing.a (Built-in StikJIT pairing)
        shell: bash
        run: |
          set -euo pipefail
          command -v rustup >/dev/null || { echo "::error::rustup is not available on this runner"; exit 1; }
          rustup target add aarch64-apple-ios
          bash build/rppairing-ios/build.sh

      # Fail here with a clear list rather than deep inside a linker error.
      - name: Verify all linked archives exist
        shell: bash
        run: |
          set +e
          MISSING=""
          for a in libgmp.a libgnutls.a libhogweed.a libnettle.a \
                   libntdll_unix.a libwin32u_unix.a libwineserver.a \
                   libdxmt_combined.a libmadeira_rppairing.a; do
            [ -f "app/Madeira/$a" ] || MISSING="$MISSING app/Madeira/$a"
          done
          for a in FEXCore/Source/libFEXCore.a FEXCore/Source/libFEXCore_Base.a \
                   FEXCore/Source/libJemallocLibs.a External/cephes/libcephes_128bit.a \
                   External/fmt/libfmt.a External/SoftFloat-3e/libsoftfloat_3e.a \
                   External/xxhash/cmake_unofficial/libxxhash.a; do
            [ -f "FEX/build-ios/$a" ] || MISSING="$MISSING FEX/build-ios/$a"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::archives missing before archive step ::$MISSING"
            exit 1
          fi
          echo "::notice::all 16 linked archives present"

      # The Xcode build phase fails when the bundled licence copies are stale.
      - name: Stage licence copies
        run: bash build/stage-licenses.sh

      # docs/BUILDING.md: "Debug is the configuration that runs the games;
      # Release builds have crashed the guest."
      # Version = 0.1.<build number> (step "Build number": the fork's one
      # sequence across Actions and the Mac), in the app (what Feather and
      # Settings > General show) and in the IPA's name, so an installed copy
      # can be matched to its build.
      - name: Stamp version 0.1.${{ steps.bn.outputs.n }}
        shell: bash
        run: |
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString 0.1.${{ steps.bn.outputs.n }}" \
            -c "Set :CFBundleVersion ${{ steps.bn.outputs.n }}" \
            app/Madeira/Info.plist
          echo "::notice::version 0.1.${{ steps.bn.outputs.n }} (build ${{ steps.bn.outputs.n }})"
          # madeira-bcd: which commit and run this IPA is; the D3D12 shader
          # cache identity (tools/build-madeira-d3d12-dll.sh) is only printed:
          # a new one means every D3D12 game converts its shaders once again.
          SCID=$(cat build/madeira-d3d12/out-pe/scid.txt 2>/dev/null || true)
          P=app/Madeira/Info.plist
          for kv in "MadeiraCommit:${GITHUB_SHA}" "MadeiraRepo:${GITHUB_REPOSITORY}" \
                    "MadeiraBuilt:$(date -u +%Y-%m-%dT%H:%M:%SZ)"; do
            k=${kv%%:*}; v=${kv#*:}
            /usr/libexec/PlistBuddy -c "Delete :$k" "$P" > /dev/null 2>&1 || true
            /usr/libexec/PlistBuddy -c "Add :$k string $v" "$P"
          done
          echo "::notice::shader cache identity ${SCID:-none}"

      # Upstream's prebuilt StikJIT.xcframework (Built-in StikJIT, read by the
      # MadeiraJITHelper extension) was built with Swift 6.4; its interface
      # names types with module selectors (Swift::String) that the runners'
      # Swift 6.3 cannot parse. Rewrite them into the dotted form in this
      # checkout (valid for every Swift); the framework binary is unchanged.
      - name: StikJIT interface for the runner's Swift
        shell: bash
        run: |
          echo "::notice::$(xcrun swift --version 2>&1 | grep -m1 'Swift version')"
          python3 tools/stikjit-interface-compat.py app/Frameworks/StikJIT.xcframework

      - name: Archive (unsigned)
        shell: bash
        run: |
          set +e
          # madeira-bcd pool-reserve: BCD_POOL_BSS_MB=1152 in the environment (run.sh / local_ci.py pass
          # it through) compiles JITAllocator.c's exec-time JIT pool reservation in. Unset or 0: the
          # command is exactly the one before, and the build carries no reservation.
          pool_bss=()
          if [ -n "${BCD_POOL_BSS_MB:-}" ] && [ "${BCD_POOL_BSS_MB}" != "0" ]; then
            pool_bss=("GCC_PREPROCESSOR_DEFINITIONS=\$(inherited) BCD_POOL_BSS_MB=${BCD_POOL_BSS_MB}")
            echo "::notice::JIT pool reservation compiled in: BCD_POOL_BSS_MB=${BCD_POOL_BSS_MB} (pool-bss)"
          fi
          xcodebuild -project app/Madeira.xcodeproj \
            -scheme Madeira -sdk iphoneos -configuration Debug \
            CODE_SIGNING_ALLOWED=NO "${pool_bss[@]}" \
            archive -archivePath build-out/Madeira.xcarchive \
            > "$GITHUB_WORKSPACE/archive.log" 2>&1
          rc=$?
          # A failing xcodebuild buries the diagnostic under a multi-kilobyte
          # swift-frontend invocation, so surface just the errors.
          if [ "$rc" -ne 0 ]; then
            echo "===== compiler errors ====="
            grep -E "^[^ ].*: (error|fatal error):" "$GITHUB_WORKSPACE/archive.log" | head -30
            # Linker diagnostics carry no "error:" prefix, so the undefined
            # symbol list needs matching on its own terms.
            echo "===== linker diagnostics ====="
            grep -E "Undefined symbol|^ld: |symbol\(s\) not found|referenced from|duplicate symbol" \
              "$GITHUB_WORKSPACE/archive.log" | head -40
            echo "===== failing build commands ====="
            sed -n '/The following build commands failed/,/failures)/p' \
              "$GITHUB_WORKSPACE/archive.log" | cut -c1-200 | head -15
          fi
          exit "$rc"

      # A device run reached DXMT and died there:
      #   err: Failed to create metal view, it seems like your Wine has no
      #        exported symbols needed by DXMT.
      # DXMT resolves the macdrv entry points with dlsym(RTLD_DEFAULT, ...)
      # against the main binary, so they have to survive into its export trie.
      # IOSDisplayShim.m marks all six __attribute__((used, visibility("default")))
      # precisely because they were dead-stripped once before, and its comment
      # records the check to confirm it -- which was never actually run. Run it.
      # A binary that ships without these renders a black screen and says
      # nothing until the log is read, so surface it at build time.
      - name: Verify the macdrv symbols DXMT resolves at runtime
        shell: bash
        run: |
          set +e
          BIN=$(find build-out/Madeira.xcarchive -type f -path "*/Madeira.app/Madeira" | head -1)
          if [ -z "$BIN" ]; then
            echo "::warning::app binary not found in the archive -- skipping export check"
            exit 0
          fi
          echo "binary: $BIN"
          xcrun dyld_info -exports "$BIN" > exports.txt 2>&1
          # Show that the tool produced a listing at all. Reading "MISS" off an
          # exports.txt that actually holds an error message would look exactly
          # like a stripped symbol, and the whole point of this step is to tell
          # those two apart.
          echo "-- dyld_info output: $(wc -l < exports.txt | tr -d ' ') lines --"
          head -5 exports.txt
          # Did the setting reach the link at all? Two rounds were lost to
          # flags that silently never arrived.
          echo "-- did the linker see the export list? --"
          grep -c "madeira-exports\|exported_symbol" archive.log 2>/dev/null \
            | sed "s/^/  archive.log mentions it this many times: /"
          echo "-- are the definitions even in the binary? (nm) --"
          nm -gU "$BIN" 2>&1 | grep -i "macdrv\|win_data" | head -10 \
            || echo "  (nm finds no macdrv symbol -- they are not in the binary at all)"
          echo "-- every macdrv symbol in the export trie --"
          grep -i "macdrv\|win_data" exports.txt | head -20
          MISSING=""
          for sym in macdrv_functions get_win_data release_win_data \
                     macdrv_view_create_metal_view macdrv_view_get_metal_layer \
                     macdrv_view_release_metal_view; do
            if grep -qE "_$sym\$" exports.txt; then
              echo "  OK   $sym"
            else
              echo "  MISS $sym"; MISSING="$MISSING $sym"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::main binary does not export ::$MISSING -- DXMT's dlsym will fail and every D3D11 title renders black"
            # Was a warning while the cause was unknown. Now that a build with
            # all six renders, shipping one without them is a regression, and
            # its only symptom is a black screen that says nothing -- three
            # days were spent reaching that conclusion once.
            exit 1
          else
            echo "::notice::all six macdrv symbols are exported"
          fi

      - name: Package Madeira and Madeira2 unsigned IPAs
        run: python3 tools/ota-variants.py package build-out/Madeira.xcarchive/Products/Applications/Madeira.app build-out ${{ steps.bn.outputs.n }}

      # Over-the-air install: sign with the owner's certificate (kept in the
      # owner's PRIVATE bucket, never in the repository) and put both signed IPAs
      # plus installation pages (7-day pre-signed links) in the same bucket.
      # A signing/upload failure is caught by the private-bucket gate below.
      - name: Sign for OTA install (private bucket)
        id: ota
        continue-on-error: true
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
          B2_SIGN_BUCKET: ${{ secrets.B2_SIGN_BUCKET }}
          SIGN_P12_PASSWORD: ${{ secrets.SIGN_P12_PASSWORD }}
          OTA_MAIL_USER: ${{ secrets.OTA_MAIL_USER }}
          OTA_MAIL_APP_PASSWORD: ${{ secrets.OTA_MAIL_APP_PASSWORD }}
          OTA_MAIL_TO: ${{ secrets.OTA_MAIL_TO }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash tools/sign-and-publish-ota.sh build-out/Madeira-0.1.${{ steps.bn.outputs.n }}-unsigned.ipa ${{ steps.bn.outputs.n }} build-out/Madeira2-0.1.${{ steps.bn.outputs.n }}-unsigned.ipa

      # Owner's decision (2026-10-02): no IPA artifact on GitHub at all. The
      # repository and its Actions are public, so an artifact is downloadable by
      # anyone; the only copy of a build is the signed IPA in the owner's
      # private R2 bucket (the OTA step above). If that step did not succeed,
      # the build fails here instead of keeping the IPA somewhere public.
      - name: Check the IPA reached the private bucket
        if: steps.ota.outcome != 'success'
        run: |
          echo "::error::OTA signing/upload did not succeed: this build's IPA was not kept anywhere (no GitHub artifact by design)"
          exit 1

      # Full logs as an artifact -- the annotations above are truncated, and
      # digging them out of the raw job log is painful.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: "*.log"
          if-no-files-found: ignore

      - name: Dump first build errors (on failure)
        if: failure()
        shell: bash
        run: |
          for L in ntdll wineserver win32u; do
            if [ -f "$L.log" ]; then
              T=$(grep -E "^(Results:|Failed:|ERROR)" "$L.log" | head -5 | python3 -c "import sys; print('%0A'.join(sys.stdin.read().splitlines()))")
              echo "::error::$L.log summary :: $T"
            fi
          done
          N=0
          for f in $(grep -rl "error:" build --include="*.err" 2>/dev/null | head -4); do
            N=$((N+1))
            MSG=$(grep -A4 -m3 "error:" "$f" | head -c 1500 | python3 -c "import sys; print('%0A'.join(sys.stdin.read().splitlines()))")
            echo "::error::REAL ERROR in $f :: $MSG"
          done
          if [ "$N" -eq 0 ]; then
            echo "::error::no .err file contains 'error:' -- failure is from a script exit or ar/link stage"
            for L in ntdll wineserver win32u; do
              if [ -f "$L.log" ]; then
                T=$(tail -n 25 "$L.log" | python3 -c "import sys; print('%0A'.join(sys.stdin.read().splitlines()))")
                echo "::error::$L.log tail :: $T"
              fi
            done
          fi
