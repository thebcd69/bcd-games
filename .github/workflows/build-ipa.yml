name: Build Madeira IPA (unsigned)

on:
  workflow_dispatch:
  # Paused while builds run on the owner's Mac (2026-10-13). To build on push
  # to main again, uncomment the three lines below.
  # push:
  #   branches: [main]
  #   paths: [".github/workflows/build-ipa.yml"]

# A push and a manual dispatch seconds apart used to start two parallel
# multi-hour macOS jobs on the same commit.
concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    # madeira-bcd: runs only in the owner's repository; a fork's run is skipped.
    if: github.repository == 'thebcd69/madeira-bcd'
    runs-on: macos-15
    # contents: write only so the token can see DRAFT releases, which is where
    # the Metal Shader Converter installer is kept (drafts are not public).
    # Nothing in this job creates, edits or pushes anything.
    permissions:
      contents: write
      actions: read
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ContentView.swift uses glassEffect(.regular, in:), which needs the
      # iOS 26 SDK. The runner defaults to Xcode 16.4 (iOS 18.5), so pick the
      # newest Xcode installed rather than whatever xcode-select points at.
      - name: Select newest Xcode
        shell: bash
        run: |
          echo "-- installed Xcodes --"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none beyond the default)"
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then
            sudo xcode-select -s "$NEWEST/Contents/Developer"
            echo "::notice::selected $NEWEST"
          fi

      # madeira-bcd FORK-ONLY: one build-number sequence across GitHub Actions
      # and the owner's Mac (owner's decision 2026-10-13). This build's number is
      # in docs/local-build/BUILD-NUMBER: the Mac's run.sh, or a cloud session
      # before it dispatches this workflow, commits it as "Build N (...)".
      # GitHub's own run_number does not follow that sequence, so nothing below
      # uses it.
      - name: Build number
        id: bn
        shell: bash
        run: |
          n=$(grep -v '^#' docs/local-build/BUILD-NUMBER | tr -d '[:space:]')
          case "$n" in
            ''|*[!0-9]*) echo "::error::docs/local-build/BUILD-NUMBER holds no build number"; exit 1 ;;
          esac
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "::notice::build $n (GitHub run #${{ github.run_number }})"

      - name: Toolchain versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version
          clang --version

      - name: Check generated settings catalog
        run: python3 tests/host/check-config-catalog.py

      # The preview still compiles every distinct input; identical checks share its successful result.
      - name: Check preview build cache correctness
        run: python3 tests/host/check-ui-preview-cache.py

      # madeira-bcd: the games' built-in recommended settings and where the app
      # applies them (GameRecommendations.swift; owner's decision 2026-10-09).
      - name: Check built-in recommended game settings
        run: python3 tests/host/check-game-recommendations.py --require-swift

      # BCD: the recommended settings online (recommended/recommendations.json, signed with
      # Ed25519; GameRecommendationsSource.swift): the built-in list equals the Swift literals it
      # replaced, signatures, allowed keys, versions, offline and a bad file keep the list in use.
      - name: Check online recommended settings
        run: python3 tests/host/check-remote-recommendations.py --require-swift

      # madeira-bcd: auto-tune (docs/AUTO-TUNE.md): off changes nothing; its hooks, rules,
      # fixtures, engine and app side.
      - name: Check auto-tune
        run: python3 tests/host/check-autotune.py --require-swift

      # GTA V Legacy's GPU reset at the first scene frame (tester logs 574-592, the owner's build 546 start): auto-tune
      # adds env.MADEIRA_DXMT_FAULT_INFO = 1, the one line the owner's build 547 start differed by, after that failure only.
      - name: Check GTA V Legacy GPU reset rule
        run: python3 tests/host/check-gta5l-gpu-reset.py

      # The Wine desktop's Start menu (BCDStartMenu.c, WineProcessBridge.m): an Explorer entry and a test program for each of
      # Direct3D 9, 10, 11 and 12, as shortcut files in the prefix's public Start Menu. The bytes are read back by a port
      # of Wine's own shell link loader, by an independent [MS-SHLLINK] reader and by Wine's winedump; the install writes
      # only when a file is missing or BCD's own and outdated, never over a person's file, and only in a desktop session.
      - name: Check the Start menu entries
        run: python3 tests/host/check-bcd-startmenu.py

      # BCD's system tests (tests/systests): the RAM test that stops before iOS would close the app (its loop is run against thousands of
      # made-up devices), the JIT pool, CPU, system info, VC++ and .NET, disk and network tests, one Windows program for x64 and one
      # for the 32-bit set. The program is built with llvm-mingw for both machines and compared with the tracked binaries.
      - name: Check the system tests
        run: python3 tests/host/check-systests.py

      # What those tests are told about the device and the engine (app/Madeira/BCDHostStatus.c, build/ntdll-unix/ios_host_status.h):
      # two small files in the prefix, only in the plain Windows desktop session; off, a session behaves as before.
      - name: Check the host status for the system tests
        run: python3 tests/host/check-host-status.py
      - name: Check the desktop session's guest-log mirror for the Start menu tests
        run: python3 tests/host/check-desktop-guest-log.py

      # BCD's Direct3D 9, 10, 11 and 12 test programs (tests/dxtests, madeira-d3d12/tests/windows/cube_window.c): shaders
      # (DXBC made offline from cube.hlsl), sources, window handling, the tracked binaries and where they ship.
      - name: Check the DirectX test programs
        run: python3 tests/host/check-dx-tests.py

      # BCD's graphics, sound, video and input test programs of round 602 (tests/dxtests, the "BCD Tests" Start menu folder): the
      # arithmetic of bcdstats.h run on the host against known answers, the two self-made clips (MP4 and ASF structure, decoded on a
      # Mac), the sources, the tracked 64-bit and 32-bit binaries rebuilt and compared, and where they ship.
      - name: Check the graphics, sound, video and input tests
        run: python3 tests/host/check-bcd-tests.py

      # 7-Zip in the Start menu (round 603): the pinned release of the project (SHA-256, licence text), the RAR code left out of the
      # object lists the build reads from 7-Zip's own makefiles, the two tracked programs (x86-64, imports a Wine session has, no RAR
      # code), the notices. BCD_CHECK_7ZIP_BUILD=1 builds both again and compares them with the tracked ones.
      - name: Check 7-Zip (pinned source, no RAR code, the tracked programs)
        run: python3 tests/host/check-7zip.py

      # BCD's runtime installer (bcd-runtimes/, round 603; the "BCD Runtimes" Start menu folder): SHA-256, deflate and ZIP against Python's
      # hashlib and zlib, the download rules (HTTPS, one host, redirects by hand), the table of runtimes, the PhysX install from NVIDIA's own
      # manifest and the DirectX cabinet reader run on fake disks and registries, the sources and the tracked program.
      - name: Check the runtime installer (downloads, checksums, XNA, PhysX, OpenAL, DirectX June 2010)
        env:
          MINGW: ${{ github.workspace }}/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin
        run: python3 tests/host/check-bcd-runtimes.py

      # Opt-in screen orientation lock for a game's session (BCDOrientation.swift): Settings › Graphics and a game's page
      # choose "follow the device" (the default, today's behaviour), landscape or a landscape side; the game's own choice wins.
      # The rule is run on the host, the UIKit part is type-checked against the iOS SDK, and off is shown to change nothing.
      - name: Check the screen orientation lock
        run: python3 tests/host/check-bcd-orientation.py

      # A Done button on the keyboard where config lines and long text are typed (BCDKeyboardDone): every editor has one.
      - name: Check the keyboard's Done button
        run: python3 tests/host/check-bcd-keyboard-done.py

      # What the classic interface did for a person, kept in BCD's (parity audit, 2026-10-18):
      # its alerts reach BCD's interface, background downloads, the Downloads tab's buttons,
      # links, no classic-only place in messages, no "Madeira" in what a person reads.
      - name: Check parity with the classic interface
        run: python3 tests/host/check-parity.py --require-swift

      # madeira-bcd FORK-ONLY: Send logs to BCD (LogUpload*.swift, bcd-logs/worker): the
      # phone's scrub is tools/autotune-fixture.py's, the gzip is valid, the compressed copy
      # is deleted, automatic sending is opt-in and Wi-Fi only.
      - name: Check Send logs to BCD
        run: python3 tests/host/check-log-upload.py --require-swift

      # The performance trace (round 604; BCDPerfTrace*.swift): one line a second, an hour at most, the newest 20 kept, sent after a log's
      # last line when the player turned it on (or a guided debug run did), nothing at all while it is off, and tools/log-facts.py reading it.
      - name: Check the performance trace
        run: python3 tests/host/check-bcd-perftrace.py --require-swift

      # Help with a game (round 604; BCDHelpCore/BCDGameHelp/BCDReadinessCore.swift and their live sides): the guided debug run (nothing sent unless the
      # player taps Send, the trace and the detailed log asked for by the session only), game feedback through the existing Feedback intake, and the
      # launch check (a note on the game's page, from the import tables of its program files), with tools/pull-logs.py reading the feedback.
      - name: Check help with a game
        run: python3 tests/host/check-bcd-help.py --require-swift

      # Shareable control layouts (round 604; BCDControlShare*.swift): a custom layout as a small JSON file, a file added as a new layout after the
      # envelope and every control are checked (size, ranges, nesting, fresh ids, a name that replaces nothing).
      - name: Check shareable control layouts
        run: python3 tests/host/check-bcd-control-share.py --require-swift

      # The performance HUD (round 603: Off, four layouts and Custom; BCDHUD*.swift, BCDFrameRing.c): the layouts against the design, an
      # old overlay carried over unchanged, the frame arithmetic, placement from the window's size and safe area alone (a phone, 4:3,
      # a near-square window, a resize), the ring under the address, undefined-behaviour and thread sanitizers, the present-path
      # patch on the pinned DXMT, nothing alive while it is off, and no touch taken from the game.
      - name: Check the performance HUD
        run: python3 tests/host/check-bcd-hud.py --require-swift

      # The session summary line ([session], BCDSessionCore.swift), the marker of an open session and the one question after a
      # session that closed unexpectedly (BCDSessionRecorderLive.swift), and the readers of the line: tools/log-facts.py and
      # the scanner behind the replay.
      - name: Check the session summary and the question after an unexpected close
        run: python3 tests/host/check-bcd-session-record.py --require-swift

      # Screenshots from the in-game menu and Send Log (BCDScreenshotLive.swift, LogUpload.swift, the intake's POST /v1/shots,
      # tools/pull-logs.py): the game's own surface only, a memory guard, Photos add-only, the picture sent as it is and only when
      # chosen, as a small copy of 100 KB or less made apart from the kept one (BCDScreenshotShrink.swift, run on generated pictures),
      # the intake's 160 KB limit, and the pull tool saving it beside its log.
      - name: Check screenshots with Send Log
        run: python3 tests/host/check-bcd-screenshot.py --require-swift

      # madeira-bcd FORK-ONLY: Settings › Feedback (FeedbackUpload*.swift, BCDSettingsFeedback.swift,
      # the intake's POST /v1/feedback, tools/pull-logs.py --feedback): the intake's gate, endpoint
      # and fields, nothing personal in the body, the person's words untouched, the limits, the
      # section's place after Logs, and the pull tool never printing the key.
      - name: Check Settings › Feedback
        run: python3 tests/host/check-feedback.py --require-swift

      # A newer BCD, said at most once a day (BCDUpdateCheck.swift, BCDUpdateNotice.swift): the source's shape
      # as tools/update-altsource.py writes it, the build compare, the day key, one host with a size cap, the
      # alert only over the library with OK alone, env.MADEIRA_UPDATE_CHECK = 0.
      - name: Check the update notice
        run: python3 tests/host/check-update-check.py --require-swift

      # An install without the increased memory limit is told once per build and where a log is sent, never blocked
      # (MemoryRights.swift; the box over the library, Settings › Logs and a game's page).
      - name: Check the memory limit notice
        run: python3 tests/host/check-memory-rights-notice.py

      # The GDI handle table a 32-bit program can map: the Dock and the library's Desktop ask for the
      # section-backed table, games keep the default, bcd.cfg can turn it off, and ntdll says when a
      # 32-bit program meets a private table (ContentView.swift, build/ntdll-unix/virtual_ios.c).
      - name: Check the section-backed GDI table
        run: python3 tests/host/check-dock-gdi-section.py

      # BCD's in-game layer (BCDSession.swift and its views, BCDSessionLive.swift): the starting
      # screen, menu button, overlay, in-game menu and key bar in BCD's look, the classic engine
      # calls behind every function, nothing alive while closed, the preview build.
      - name: Check BCD's in-game layer
        run: python3 tests/host/check-bcd-session.py --require-swift --require-preview

      # BCD's store-neutral content engine (app/Madeira/BCDContent/, docs/GOG.md): plans, streamed
      # and checked chunks, the journal across a kill, pause and cancel, free space, Range resume,
      # host rotation, the queue (game sessions, one download at a time with Steam), memory.
      - name: Check the content engine
        run: python3 tests/host/check-content-engine.py --require-swift

      # GOG in BCD, milestone 1 (app/Madeira/BCDGOG/): sign-in without a token in any log, the
      # library and its pictures, builds and manifests into a plan, install into C:\GOG Games
      # end to end, the play task as a library entry. Synthetic replies only: GOG is never contacted.
      - name: Check GOG
        run: python3 tests/host/check-gog.py --require-swift

      # Epic Games in BCD, milestone 0 (app/Madeira/BCDEpic/): sign-in on Epic's own page, the owned
      # games and their pictures, the Keychain-only token rule, the masks on every [epic-*] log line,
      # the tokens sent to Epic's hosts only, the preview build. Synthetic replies only: Epic is never contacted.
      - name: Check Epic Games
        run: python3 tests/host/check-epic.py --require-swift --require-preview

      # BCD Host (bcd-host/): the helper that starts an Epic game signed in, inside Wine (milestone 2). Its
      # request reader under AddressSanitizer and a fuzz, the report's bounds; with llvm-mingw also the PE itself
      # (x86-64, GUI, relocatable, kernel32 only, no secret text). Without the toolchain only the host part runs.
      - name: Check BCD Host
        run: python3 tests/host/check-bcd-host.py

      # Epic's start arguments (the one-time code, the account's ID and name) are masked in the two places the runtime and
      # the bridge print a command line (build/bcd_epic_mask.h): both forms compiled and fuzzed, both call sites read.
      - name: Check Epic's masks
        run: python3 tests/host/check-epic-mask.py

      # madeira-bcd FORK-ONLY: the public alpha IPA is unsigned and carries nothing about the
      # owner (tools/make-alpha-ipa.py, owner 2026-10-17).
      - name: Check the alpha IPA tool
        run: python3 tests/host/check-alpha-ipa.py

      # BCD's interface, Settings › Accounts, JIT and BCD Dock (BCDAccounts/JIT/Dock.swift):
      # no engine type in the views, sign-out and the Dock reset only after a question, the
      # password never kept or logged, the JIT methods per iOS version, the preview build.
      - name: Check Settings › Accounts, JIT and BCD Dock
        run: python3 tests/host/check-bcd-settings-accounts.py --require-preview

      # madeira-bcd: the Dock's Reset removes what one-time installs put into the prefix,
      # and the installs run in a session of their own (DockReset.swift; 2026-10-12).
      - name: Check the Dock's one-time install reset
        run: python3 tests/host/check-dock-reset.py --require-swift

      # madeira-bcd (round 578): Valve's client service (Steam Client Service) is installed before a
      # custom-executable (CEG) Dock start, with Valve's own SteamService.exe, because the host's
      # in-session installer failed over RPC 1726 in 3 of 5 logged sessions (DockCEGService).
      - name: Check Valve's client service for a CEG Dock start
        run: python3 tests/host/check-dock-ceg-service.py --require-swift

      # madeira-bcd (round 591): the "Registry" values of a game's Steam install script, written before a Dock
      # start (env.MADEIRA_DOCK_SCRIPT_REGISTRY = 1; Fallout: New Vegas' launcher needs its Installed Path).
      - name: Check the Dock's install-script registry values
        run: python3 tests/host/check-dock-script-registry.py --require-swift

      # Every Play and download of BCD's interface goes the classic library's way (the same
      # launch function and checks for Steam via BCD Dock or directly, programs from Files and the
      # desktop; downloads that keep running in the background on iOS 26; nothing for Epic or GOG).
      - name: Check BCD's game starts and downloads
        run: python3 tests/host/check-bcd-launch.py --require-swift

      # Host checks that sat in tests/host without a workflow step until round 624. Every one passed in the committed tree with its
      # submodules at their pins and in the built tree, so their place here does not matter; none needs an environment variable
      # (wine/, FEX/, dxmt/, madeira-dock/ are at the repository root). Group 1 needs only the checkout (swiftc or cc where the check
      # compiles); group 2 are the checks whose test was brought up to date with the code in round 624.

      # ===== Group 1: 72 checks (check-jit-network opens loopback listeners only); none writes outside its temp folder; 0.1-14 s each under load =====

      # tools/update-altsource.py builds the AltStore source from a release (download and codesign are mocked)
      - name: Check altsource
        run: python3 tests/host/check-altsource.py

      # the iOS audio driver folds 5.1/7.1 layouts into the stereo bus (MADEIRA_AUDIO_DOWNMIX=0 restores the old mapping)
      - name: Check audio downmix
        run: python3 tests/host/check-audio-downmix.py

      # the 32-bit audio driver table keeps the 64-bit table's 37 slots and the render-scratch allocator keeps a guest ceiling.
      - name: Check audio wow64
        run: python3 tests/host/check-audio-wow64.py

      # bcd.cfg is found by native readers that run before the guest starts (early docs dir, HOME order)
      - name: Check cfg early docs
        run: python3 tests/host/check-cfg-early-docs.py

      # a library game's own cfg lines ($MADEIRA_CFG_GAME) win over bcd.cfg.
      - name: Check cfg game
        run: python3 tests/host/check-cfg-game.py

      # a pseudo-process child gets a desktop window like the session.
      - name: Check child desktop
        run: python3 tests/host/check-child-desktop.py

      # a pseudo-process child's emulator gets the child's own ntdll copy (JIT alias push)
      - name: Check child ntdll alias
        run: python3 tests/host/check-child-ntdll-alias.py

      # Chromium's out-of-memory exit names the failed request's size at NtTerminateProcess ([chromium-oom])
      - name: Check chromium oom exit
        run: python3 tests/host/check-chromium-oom-exit.py

      # unchanged ClipCursor requests notify no one (wineserver queue_ios.c)
      - name: Check clip dedupe
        run: python3 tests/host/check-clip-dedupe.py

      # a console's conhost.exe starts without a window (--headless)
      - name: Check console headless
        run: python3 tests/host/check-console-headless.py

      # touch-control layouts and built-in presets (Foundation-only Swift blocks compiled on the host)
      - name: Check control presets
        run: python3 tests/host/check-control-presets.py

      # SwapDeviceContextState patch and the opt-in source build of DXMT's 64-bit d3d11.dll.
      - name: Check d3d11 src
        run: python3 tests/host/check-d3d11-src.py

      # opt-in tiled resources of the D3D12 runtime (d3d12-tiled-resources = 1)
      - name: Check d3d12 tiled
        run: python3 tests/host/check-d3d12-tiled.py

      # round 624: the D3D12 methods that refuse a call say which ([madeira-d3d12] FAILED, log only), the unix ntdll's
      # log-only lines of the round stay where they belong, and the Wine server survives a refused master-socket bind
      - name: Check round 624 log lines
        run: |
          python3 tests/host/check-d3d12-fail-log.py
          python3 tests/host/check-round624-log-lines.py
          python3 tests/host/check-wineserver-bind-fallback.py
          python3 tests/host/check-gdi-table-child.py
          python3 tests/host/check-wow-unity-plain.py
          python3 tests/host/check-present-lum.py
          python3 tests/host/check-no-input-hint.py
          python3 tests/host/check-windowed-hint.py
          python3 tests/host/check-open-url.py
          python3 tests/host/check-win-text.py
          python3 tests/host/check-cluster-logs.py
          python3 tests/host/check-fex-fault-diag.py
          python3 tests/host/check-early-fault.py
          python3 tests/host/check-log-upload-guard.py
          python3 tests/host/check-jit-brk-trail.py
          python3 tests/host/check-ill-insn-diag.py
          python3 tests/host/check-installs-countdown.py
          python3 tests/host/check-kernelbase-optin.py
          python3 tests/host/check-fex-alias-capacity.py
          python3 tests/host/check-godot-composition.py
          python3 tests/host/check-clr-death-diag.py
          python3 tests/host/check-crypt32-root-enum.py
          python3 tests/host/check-gpu-stall.py
          python3 tests/host/check-gpu-time-wow64.py
          python3 tests/host/check-noexec-who.py
          python3 tests/host/check-desktop-shell.py
          python3 tests/host/check-d9-texfmt.py
          python3 tests/host/check-d9-query-stuck.py
          python3 tests/host/check-d11-query-stuck.py
          python3 tests/host/check-soft-pool-decommit.py
          python3 tests/host/check-mem-burst.py

      # DXMT D3D9 upload ring stays bounded while a title loads without Present (ml1490)
      - name: Check d9 upload commit
        run: python3 tests/host/check-d9-upload-commit.py

      # tools/patch-wine-dns-trace.py names every getaddrinfo and bounds it on request.
      - name: Check dns trace
        run: python3 tests/host/check-dns-trace.py

      # Madeira Dock's transfer path through Wine's own prefix resolver.
      - name: Check dock path
        run: python3 tests/host/check-dock-path.py

      # Madeira Dock's report parser (whitelisted numeric fields only)
      - name: Check dock report
        run: python3 tests/host/check-dock-report.py

      # IDXGIFactory7 for DXMT's factory and the opt-in dxgi.dll source build.
      - name: Check dxgi factory7
        run: python3 tests/host/check-dxgi-factory7.py

      # every DXMT/airconv/winemetal patch script applies in the workflow's order and is idempotent.
      - name: Check dxmt patch chain
        run: python3 tests/host/check-dxmt-patch-chain.py

      # conhost.exe is refused in an ARM64EC session.
      - name: Check ec conhost
        run: python3 tests/host/check-ec-conhost.py

      # NtProtectVirtualMemory's [exec-req] path leaves the syscall callback.
      - name: Check execreq leave
        run: python3 tests/host/check-execreq-leave.py

      # FEX arena failure census: clipping, protection accounting, alignment, bounded output.
      - name: Check fex arena census
        run: python3 tests/host/check-fex-arena-census.py

      # tools/patch-fex-ios-callret-8mb.py against the pinned FEX tree.
      - name: Check fex callret 8mb
        run: python3 tests/host/check-fex-callret-8mb.py

      # D3D9 sampler anisotropy cap (getOrCreateSampler, ml1250)
      - name: Check filtering cap
        run: python3 tests/host/check-filtering-cap.py

      # a version query cannot use up the fixed-base window (GTA V launcher, RDR2)
      - name: Check fixed base guard
        run: python3 tests/host/check-fixed-base-guard.py

      # delayed release of 1-16 MB guest allocations (MADEIRA_FREE_DELAY_MS)
      - name: Check free delay
        run: python3 tests/host/check-free-delay.py

      # library front end: launch profiles, controller navigation, session exit report.
      - name: Check frontend
        run: python3 tests/host/check-frontend.py

      # snapshot transport and win32u gamepad query.
      - name: Check gamepad
        run: python3 tests/host/check-gamepad.py

      # a scalar guest store crossing the end of an anonymous alias is stored page by page (build 623)
      - name: Check gpr store straddle
        run: python3 tests/host/check-gpr-store-straddle.py

      # opt-in HID controller: descriptors and reports read back through Wine's own hid.dll code.
      - name: Check hidpad
        run: python3 tests/host/check-hidpad.py

      # a module loaded again at the base of its unloaded pool copy gets fresh .data/.bss.
      - name: Check image reload
        run: python3 tests/host/check-image-reload.py

      # unloaded-image translation retirement (MADEIRA_JIT_IMAGE_RETIRE)
      - name: Check image retire
        run: python3 tests/host/check-image-retire.py

      # the JIT-pool dump is opt-in (ios_jit_dump_enabled)
      - name: Check jit dump optin
        run: python3 tests/host/check-jit-dump-optin.py

      # every child gets the JIT pool's WINE_IOS_JIT_* variables (ios_env_with)
      - name: Check jit env
        run: python3 tests/host/check-jit-env.py

      # StikDebug and the iOS 26 built-in JIT helper: static integration checks.
      - name: Check jit method
        run: python3 tests/host/check-jit-method.py

      # LocalDevVPN loopback check and the JIT shortcut (JITNetwork.swift LoopbackProbe)
      # Opens listeners on 127.0.0.1 (ephemeral ports) only; nothing leaves the machine.
      - name: Check jit network
