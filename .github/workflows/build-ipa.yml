      # madeira-bcd: env.MADEIRA_FEX_BAND_KEEP_MB (off by default): the steer valve may not take the lowest N MB
      # of the emulator's arena (No Rest for the Wicked, build 574: "FEXAlloc could not allocate").
      - name: Check FEX band keep
        run: python3 tests/host/check-fex-band-keep.py

      # madeira-bcd: env.DOTNET_EnableWriteXorExecute = 0 for a self-contained .NET 7+ game (Quaver, build 574: the
      # CLR's write-barrier assert); the runtime's own switch, wired to auto-tune and Quaver's list.
      - name: Check .NET write-xor-execute off
        run: python3 tests/host/check-dotnet-wx.py

      # madeira-bcd: env.DOTNET_GCRegionRange = 400000000 (16 GB) for a .NET 7+ game whose garbage collector cannot reserve its
      # 256 GB range (Unrailed! 2, build 576: "GC heap initialization failed with error 0x8007000E"); wired to auto-tune and the list.
      - name: Check .NET GC region range
        run: python3 tests/host/check-dotnet-gc-region.py

      # madeira-bcd: [nt-fail] (every failed NtAllocateVirtualMemory[Ex] / NtMapViewOfSection[Ex] with the process, size,
      # flags and extended parameters, once per kind) and [map-name] (every named section a process creates or opens, with the
      # status): the Rockstar service never reached its 2 MB shared-memory allocation in builds 574/576. Logging only.
      - name: Check [nt-fail] and [map-name]
        run: |
          python3 tests/host/check-nt-fail-log.py
          python3 tests/host/check-map-name-log.py

      # round 579: an AnyCPU IL-only .NET program (PE32, no 32BITREQUIRED) was run as a native ARM64 process, whose set has no
      # mscoree.dll: "mscoree.dll not found, IL-only binary ... cannot be loaded", c000007b (The Dishwasher: Vampire Smile,
      # SSXDRW). The server's copy (build/wineserver/mapping_ios.c) withholds ComPlusNativeReady while aarch64-windows has no
      # mscoree.dll, so the program runs as i386 under WoW64 with Wine Mono, as 32BITREQUIRED .NET programs do.
      - name: Check the AnyCPU .NET machine (no native ARM64 without an mscoree.dll)
        run: python3 tests/host/check-ilonly-machine.py

      # madeira-bcd (round 577): a child's ntdll copy skips a pool range that lost EXEC (Vice City AE6NQZ/S0TH0N), a small
      # address map retries the next free range after a refused MAP_FIXED (iPhone13,4 / iOS 18), and every spawn line
      # names the child's current directory (Terraria's "Asset could not be found").
      - name: Check pool dead-range skip, small-map retry, spawn cwd
        run: |
          python3 tests/host/check-pool-dead-range.py
          python3 tests/host/check-reserved-area-retry.py
          python3 tests/host/check-spawn-cwd-log.py
          python3 tests/host/check-tail-carve-exec.py

      # madeira-bcd (round 578): a program that ends on a thread other than the engine's boot thread (GTA IV, Stranglehold)
      # never made __wine_main return, so BCD kept the last frame for good: the library now ends such a session when none of
      # the program's own processes is left, says "The game closed (exit code N)", and returns; the app's own program name is
      # given back as the program ends (the dangling getprogname() that crashed iOS afterwards); a child that ended off its
      # boot thread no longer keeps a launcher's session alive (Hello Neighbor).
      - name: Check session end off the boot thread
        run: python3 tests/host/check-session-end.py

      # madeira-bcd (round 579, Trails in the Sky 1st Chapter 24VADD/X56ZXZ/YTMNEK): GetDisplayConfigBufferSizes says "1 path, 2 modes" for
      # the virtual monitor and QueryDisplayConfig answers "success, 0 paths": a game that builds its fullscreen window from the paths
      # makes a one-pixel window at 32767 and then clears a NULL swapchain. The default answers are unchanged (the test runs the
      # production function against build 578's, byte for byte, on the host); a [vdcfg-mismatch] line names both answers once, and
      # env.MADEIRA_VDCFG_PATH = 1 (auto-tune rule vdcfg-virtual-path, only after that crash) lists the virtual monitor's path.
      - name: Check QueryDisplayConfig and the virtual monitor's path
        run: python3 tests/host/check-vdcfg-path.py

      # madeira-bcd (round 579, Stardew Valley BD8079/S4QB4S/XK1A2J): the .NET runtime's threads call GetLastError / SetLastError 12-19
      # million times a second before any window exists. [spin] ml1140 (build/ntdll-unix/server_ios.c) keys on the xprobe's own x64->EC
      # numbers (same target, 4 reports) and logs the busy threads' registers, the x86 code at the guest RIP and the x86 return
      # addresses once per streak; nothing runs in the game's threads; MADEIRA_LEAN_DIAG touches no thread.
      - name: Check the [spin] call-rate look
        run: python3 tests/host/check-spin-diag.py

      # madeira-bcd (round 623, Forza Horizon 4 D9NHGJ / RVXHV6 / 58VNDB): the [spin] ml677 snapshot (build/ntdll-unix/signal_arm64_ios.c) also
      # prints 256 guest code bytes from rip-192, the guest registers and 128 guest stack words, only when a spin streak fires.
      - name: Check the [spin] guest code and stack window
        run: python3 tests/host/check-spin-guest-context.py

      # madeira-bcd (round 579): a BCD Dock session whose game died with an error (Dying Light 32FEAT, The Binding of Isaac VV5NHZ:
      # c0000005) stayed open on its dead desktop: the session's own program is Wine's desktop, which never closes by itself on iOS.
      # The library now ends it when the game's last process ended with an error status, nothing of the game runs, the host
      # finished and 10 s passed (DockGameEnd.swift, process_ios.c's ring of ended processes, wine_session_dock_game_ended), and says
      # which Windows error the game closed with; auto-tune gets the status.
      # env.MADEIRA_DOCK_GAME_END = 0 turns it off, env.MADEIRA_DOCK_GAME_END_GRACE sets the seconds.
      - name: Check Dock game end
        run: ASAN_OPTIONS=symbolize=0 python3 tests/host/check-dock-game-end.py

      # madeira-bcd (round 624, agent D2 S3 and S7; Geometry Dash from the Windows desktop VDFZHN, Steam with Rockstar's launcher RX4AK5):
      # the Windows desktop says why a program ended at once. The engine marks a process that made a real OpenGL call (the stub table,
      # virtual_ios.c) and keeps the mark with its end (process_ios.c, madeira_child_ends_since); the library logs [desktop-exit] and
      # puts one notice on the session line for an OpenGL program, and once when the JIT pool refuses an image. Text and log only.
      - name: Check the Windows desktop's exit watch
        run: ASAN_OPTIONS=symbolize=0 python3 tests/host/check-desktop-exit.py

      # madeira-bcd (round 579, Tomb Raider: Underworld ZWAA2K): a 32-bit main program that cannot get its 4 GB window ended the boot
      # thread with pthread_exit (fatal_error), so the session never ended and the app showed "running" for three minutes. The failure
      # now reports its status and leaves by exit(): the shim long-jumps back to wine_process_thread on the boot thread.
      - name: Check a 32-bit main program that cannot get its window
        run: python3 tests/host/check-main-window-exit.py

      # madeira-bcd (round 578, ajan6-arkham): Batman: Arkham City GOTY (builds 574/576) and Injustice (574) die in the same UE3 lock-free
      # list pop right after a 64-bit FILD/FISTP that the emulator's 64-bit x87 (X87ReducedPrecision, on for 32-bit guests) rounds to 53
      # bits. [x87-int64] (build/ntdll-unix/ios_x87_int64_diag.h) compares the list head's memory with the value the guest got and says
      # LOST or EXACT; [fault-rgn] names the views below and above the fault and the views under 1 MB around it, and the provenance
      # line says when its view is gone (virtual_ios.c). Log only; the first test compiles the production header and runs it on
      # constructed memory (macOS), the second the ring and provenance functions against fakes. Rule x87-int64-roundtrip (auto-tune)
      # is checked with the other rules.
      - name: Check [x87-int64] and the fault neighbour lines
        run: |
          python3 tests/host/check-x87-int64-diag.py
          python3 tests/host/check-fault-neighbour-diag.py

      # ajan7-arkham: [wow-null32] (a 32-bit guest's use of the NULL page: registers, stack and TLS cells) and the [tls-cross-clear] line
      # plus MADEIRA_TLS_CLEAR_OWN_PROCESS (TlsFree reaches into other pseudo-processes' threads); compiled runs against fakes (macOS).
      - name: Check [wow-null32] and the TlsFree cross-process line
        run: |
          python3 tests/host/check-wow-null-diag.py
          python3 tests/host/check-tls-clear-process.py

      # ajan11-wow64stack: a dead 32-bit thread's stack is released in ITS window (virtual_free_teb handed it to the next exiting
      # thread, of another process, and the release landed on that process's live stack: Battle.net's network-service helper), and a
      # storm in a child Windows process ends that process only, not the app (MADEIRA_REDELIV_CHILD_ONLY=0 = the old ending); a
      # protection fault (SIGBUS) inside a system call's __TRY (the EA installer's ReadProcessMemory probe of its own stack) fails the call.
      # Compiled runs against fakes (macOS/Linux); the four changed files are also compiled for iOS when the wine headers exist.
      - name: Check the dead-thread stack release, the child-process storm ending and the system-call fault
        run: python3 tests/host/check-wow-stack-storm.py

      # madeira-bcd: kernelbase-fibertrace.dll (env.MADEIRA_FIBER_TRACE): the fiber calls logged.
      - name: Check kernelbase fiber trace
        run: python3 tests/host/check-kernelbase-fibertrace.py

