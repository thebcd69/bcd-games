      - name: Check opt-in DLLs
        run: python3 tests/host/check-optin-dlls.py

      # madeira-bcd (round 620): NtMapViewOfSection judges a 32-bit program's explicit base by its guest address inside
      # its WoW64 window (DirectPlay's static data at 0x50000000: Requiem, Hotline Miami); the real block runs on the host.
      - name: Check WoW64 explicit section base
        run: python3 tests/host/check-wow-map-zero-bits.py

